name: Build Alpha APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Alpha APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleSidecar

      - name: Prepare installers
        run: |
          mkdir -p installers
          cp app/build/outputs/apk/debug/app-debug.apk installers/ProxyScroll-0.12.0-alpha25-update.apk
          cp app/build/outputs/apk/sidecar/app-sidecar.apk installers/ProxyScroll-0.12.0-alpha25-sidecar.apk

      - name: Apply stable Alpha signatures
        run: |
          set -euo pipefail
          for apk in installers/*.apk; do
            aligned_apk="$RUNNER_TEMP/$(basename "$apk").aligned"
            signed_apk="$RUNNER_TEMP/$(basename "$apk").signed"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$apk" "$aligned_apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks app/proxyscroll-alpha.keystore \
              --ks-key-alias proxyscrollalpha \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "$signed_apk" \
              "$aligned_apk"
            mv "$signed_apk" "$apk"
          done

      - name: Verify installability
        run: |
          set -euo pipefail
          : > installers/APKSIGNER-REPORT.txt
          for apk in installers/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --verbose \
              --print-certs \
              "$apk" | tee -a installers/APKSIGNER-REPORT.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
              | sed -n '1,3p' \
              | tee -a installers/APKSIGNER-REPORT.txt
          done
          sha256sum installers/*.apk > installers/SHA256SUMS.txt

      - name: Upload Alpha installers
        uses: actions/upload-artifact@v4
        with:
          name: ProxyScroll-0.12.0-alpha25-installers
          path: installers
          if-no-files-found: error
          retention-days: 30
